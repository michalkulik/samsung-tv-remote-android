org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# Release signing. The keystore is intentionally part of the repository so that
# every build (local and CI) produces an identically signed, upgradeable APK.
keystore.file=keystore/samsung-tv-remote-release.jks
keystore.password=samsung-tv-remote
signing.key.alias=samsung-tv-remote
signing.key.password=samsung-tv-remote
